# Runs the whole app: Postgres, the API and the web frontend.
#   cp .env.example .env     (set real passwords and JWT_SECRET)
#   docker compose up -d --build
# Then open http://localhost:8080
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Serves the web app and forwards /api/* to the backend, so the browser only talks to one origin.
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      # Behind your own reverse proxy (Caddy, Traefik, ...) replace this with: expose: ["80"]
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
