server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Photos are uploaded as base64 JSON.
  client_max_body_size 10m;

  # Database export and import: very large bodies, streamed both ways without buffering.
  location /api/admin/ {
    proxy_pass http://backend:3000/admin/;
    proxy_http_version 1.1;
    client_max_body_size 0;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    # The trailing slash strips the /api prefix.
    proxy_pass http://backend:3000/;
    # Buy check waits for the image recognition provider (up to ~45 s, twice if it retries).
    proxy_read_timeout 120s;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build assets can be cached forever.
  location /_expo/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single page app: unknown paths fall back to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
