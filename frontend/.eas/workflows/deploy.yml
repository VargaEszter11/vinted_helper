# Builds the web app and deploys it to EAS Hosting (production) on every push to main.
# Needs the GitHub repo connected in expo.dev with base directory "frontend", and
# EXPO_PUBLIC_SUPABASE_URL / EXPO_PUBLIC_SUPABASE_ANON_KEY set in the EAS "production" environment.
name: Deploy

on:
  push:
    branches: ['main']

jobs:
  deploy:
    type: deploy
    name: Deploy
    environment: production
    params:
      prod: true
